<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#0A2E63">
  <link rel="icon" type="image/png" href="/images/marca/favicon.png">
  <link rel="apple-touch-icon" href="/images/marca/icon-192.png">
  <title>Ventas — Mundo Hogar Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zydotmaolgddwenwywyc.supabase.co" crossorigin>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="ventas">
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img class="sidebar-brand-icon" src="/images/marca/logo-mundo-hogar.png" alt="Mundo Hogar" width="32" height="32"><div class="sidebar-brand-text"><span class="sidebar-brand-name">Mundo Hogar</span><span class="sidebar-brand-sub">Panel Admin</span></div></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar" id="user-avatar">?</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name">Cargando...</div><div class="sidebar-user-role" id="user-role"></div></div></div></div>
  </aside>
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <div class="main-wrap">
    <header class="main-header">
      <button class="header-toggle" id="sidebar-toggle">☰</button>
      <span class="header-title" id="page-title"></span>
      <div class="header-actions">
        <a href="/admin/vender" class="btn btn-primary btn-sm">🛒 Vender</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div><h1>Ventas</h1><p id="subtitle">Lo que se cobró en el mostrador. Los pedidos de la tienda están en Pedidos web.</p></div>
        <div class="page-header-actions">
          <button class="btn btn-outline btn-sm" id="btn-export">⬇ Exportar CSV</button>
          <button class="btn btn-outline btn-sm" id="btn-refrescar">↻ Actualizar</button>
        </div>
      </div>

      <div class="chips chips-filtro" id="rangos">
        <button type="button" class="chip active" data-r="hoy">Hoy</button>
        <button type="button" class="chip" data-r="ayer">Ayer</button>
        <button type="button" class="chip" data-r="semana">Esta semana</button>
        <button type="button" class="chip" data-r="mes">Este mes</button>
        <button type="button" class="chip" data-r="custom">Elegir fechas</button>
      </div>

      <div class="kpi-grid" id="kpis">
        <div class="kpi-card"><div class="kpi-icon green">💵</div><div class="kpi-label">Total cobrado</div><div class="kpi-value" id="k-total">—</div><div class="kpi-sub" id="k-total-sub">—</div></div>
        <div class="kpi-card"><div class="kpi-icon blue">🧾</div><div class="kpi-label">Ventas</div><div class="kpi-value" id="k-n">—</div><div class="kpi-sub" id="k-n-sub">—</div></div>
        <div class="kpi-card"><div class="kpi-icon gold">📦</div><div class="kpi-label">Unidades</div><div class="kpi-value" id="k-u">—</div><div class="kpi-sub" id="k-u-sub">—</div></div>
        <div class="kpi-card"><div class="kpi-icon violet">💳</div><div class="kpi-label">Por medio de pago</div><div class="kpi-sub" id="k-medios" style="margin-top:6px;line-height:1.6">—</div></div>
      </div>

      <div class="filters-bar">
        <div class="search-bar"><span class="search-icon">🔍</span><input type="search" id="q" placeholder="Código, cliente, producto…"></div>
        <input type="date" id="f-desde" style="min-width:140px">
        <input type="date" id="f-hasta" style="min-width:140px">
        <select id="f-medio" style="min-width:150px"><option value="">Todos los medios</option></select>
        <select id="f-vend" style="min-width:150px"><option value="">Todos los vendedores</option></select>
        <select id="f-estado" style="min-width:130px"><option value="cerrada">Cobradas</option><option value="pendiente_cobro">Esperando cobro</option><option value="anulada">Anuladas</option><option value="">Todas</option></select>
        <span class="filter-count" id="filter-count"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Código</th><th>Cliente / vendedor</th><th>Ítems</th><th>Medio</th><th style="text-align:right">Total</th><th>Estado</th><th></th></tr></thead>
          <tbody id="tabla-body"><tr class="fila-plana"><td colspan="8" class="text-center" style="padding:40px"><div class="spinner"></div></td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script src="/admin/js/supabase-client.js"></script>
<script src="/admin/js/auth.js"></script>
<script src="/admin/js/utils.js"></script>
<script src="/admin/js/layout.js"></script>
<script src="/admin/js/impresion.js"></script>
<script>
const MEDIOS = { efectivo:'Efectivo', transferencia:'Transferencia', debito:'Débito', credito:'Crédito', mercadopago:'Mercado Pago', cuenta_corriente:'Cuenta corriente', web:'Pagado online', otro:'Otro', mixto:'Pago mixto', pendiente:'A cobrar en caja' };
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = n => Utils.currency(n);
let ventas = [], perfil = null, rango = 'hoy';
const $id = id => document.getElementById(id);
const iso = d => d.toISOString().slice(0,10);

function setRango(r) {
  rango = r;
  document.querySelectorAll('#rangos .chip').forEach(c => c.classList.toggle('active', c.dataset.r === r));
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  let d = new Date(hoy), h = new Date(hoy);
  if (r === 'ayer') { d.setDate(d.getDate()-1); h = new Date(d); }
  if (r === 'semana') { const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); }
  if (r === 'mes') d = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  if (r !== 'custom') { $id('f-desde').value = iso(d); $id('f-hasta').value = iso(h); return cargar(); }
}
document.getElementById('rangos').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) setRango(b.dataset.r); });
['f-desde','f-hasta'].forEach(id => $id(id).addEventListener('change', () => { rango = 'custom'; document.querySelectorAll('#rangos .chip').forEach(c => c.classList.toggle('active', c.dataset.r === 'custom')); cargar(); }));
['q','f-medio','f-vend','f-estado'].forEach(id => { $id(id).addEventListener('input', render); $id(id).addEventListener('change', render); });

async function cargar() {
  const desde = new Date($id('f-desde').value + 'T00:00:00');
  const hasta = new Date($id('f-hasta').value + 'T23:59:59.999');
  // venta_pagos existe desde sql/026 (con qué se cobró); sin él, se pide como antes
  let { data, error } = await db.from('ventas').select('*, venta_items(*), venta_pagos(medio_pago, monto, monto_original, cuenta_cobro_id, nro_operacion, orden)')
    .gte('fecha', desde.toISOString()).lte('fecha', hasta.toISOString())
    .order('fecha', { ascending: false }).limit(2000);
  if (error && /venta_pagos/.test(error.message || '')) ({ data, error } = await db.from('ventas').select('*, venta_items(*)')
    .gte('fecha', desde.toISOString()).lte('fecha', hasta.toISOString())
    .order('fecha', { ascending: false }).limit(2000));
  if (error) {
    const m = (error.message||'').toLowerCase();
    $id('tabla-body').innerHTML = `<tr class="fila-plana"><td colspan="8"><div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>${m.includes('ventas') ? 'Falta ejecutar sql/013 en la base' : 'No se pudieron cargar las ventas'}</h3><p>${esc(error.message)}</p></div></td></tr>`;
    return;
  }
  ventas = data || [];
  const vends = [...new Set(ventas.map(v => v.vendedor_nombre).filter(Boolean))].sort();
  const vs = $id('f-vend'); const act = vs.value;
  vs.innerHTML = '<option value="">Todos los vendedores</option>' + vends.map(v => `<option${v===act?' selected':''}>${esc(v)}</option>`).join('');
  const ms = $id('f-medio'); const actM = ms.value;
  ms.innerHTML = '<option value="">Todos los medios</option>' + Object.entries(MEDIOS).map(([k,v]) => `<option value="${k}"${k===actM?' selected':''}>${v}</option>`).join('');
  render();
}

function filtrar() {
  const q = $id('q').value.toLowerCase().trim(), medio = $id('f-medio').value, vend = $id('f-vend').value, est = $id('f-estado').value;
  return ventas.filter(v => {
    if (est && v.estado !== est) return false;
    if (medio && v.medio_pago !== medio) return false;
    if (vend && v.vendedor_nombre !== vend) return false;
    if (q) {
      const txt = [v.codigo, v.cliente_nombre, v.cliente_telefono, v.vendedor_nombre, ...(v.venta_items||[]).map(i => i.nombre + ' ' + (i.sku||''))].join(' ').toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const lista = filtrar();
  const cerradas = lista.filter(v => v.estado === 'cerrada');
  const total = cerradas.reduce((s,v) => s + Number(v.total), 0);
  const unid = cerradas.reduce((s,v) => s + Number(v.unidades||0), 0);
  $id('k-total').textContent = money(total);
  $id('k-total-sub').textContent = cerradas.length ? `ticket promedio ${money(total / cerradas.length)}` : 'sin ventas en el período';
  $id('k-n').textContent = cerradas.length;
  $id('k-n-sub').textContent = `${lista.length - cerradas.length} anulada${lista.length - cerradas.length !== 1 ? 's' : ''}`;
  $id('k-u').textContent = unid;
  $id('k-u-sub').textContent = `${cerradas.reduce((s,v)=>s+Number(v.stock_afectado||0),0)} renglones descontaron stock`;
  const porMedio = {};
  cerradas.forEach(v => porMedio[v.medio_pago] = (porMedio[v.medio_pago]||0) + Number(v.total));
  $id('k-medios').innerHTML = Object.entries(porMedio).sort((a,b)=>b[1]-a[1]).map(([m,t]) => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(MEDIOS[m]||m)}</span><b>${money(t)}</b></div>`).join('') || '—';
  $id('filter-count').textContent = `${lista.length} venta${lista.length!==1?'s':''}`;

  if (!lista.length) {
    $id('tabla-body').innerHTML = `<tr class="fila-plana"><td colspan="8"><div class="empty-state"><div class="empty-state-icon">🧮</div><h3>Sin ventas</h3><p>No hay ventas del local en este período con esos filtros.</p><a class="btn btn-primary" href="/admin/vender">🛒 Vender</a></div></td></tr>`;
    return;
  }
  $id('tabla-body').innerHTML = lista.map(v => `<tr class="${v.estado==='anulada'?'vta-estado-anulada':''}" data-id="${v.id}">
    <td class="c-fecha" style="white-space:nowrap;color:var(--muted);font-size:12px">${Utils.datetime(v.fecha)}</td>
    <td class="c-cod" style="font-family:monospace;font-size:12px">${esc(v.codigo)}</td>
    <td class="c-cli"><div style="font-weight:500;font-size:13px">${esc(v.cliente_nombre || 'Consumidor final')}</div><div style="font-size:11.5px;color:var(--muted)">${esc(v.vendedor_nombre||'')}</div></td>
    <td class="c-items" data-l="Ítems" style="font-size:12.5px;color:var(--muted)">${(() => { const it = (v.venta_items||[]).filter(i => i.cantidad > 0); return it.slice(0,3).map(i => `${i.cantidad}× ${esc(i.nombre)}`).join('<br>') + (it.length > 3 ? `<br>… y ${it.length - 3} más` : ''); })()}</td>
    <td class="c-medio"><span class="vta-medio vta-medio-${esc(v.medio_pago)}">${esc(MEDIOS[v.medio_pago]||v.medio_pago)}</span></td>
    <td class="c-total" style="text-align:right;font-weight:600">${money(v.total)}</td>
    <td class="c-est">${v.estado === 'anulada' ? '<span class="badge badge-danger">Anulada</span>' : v.estado === 'pendiente_cobro' ? `<span class="badge badge-warning">${v.devuelta_motivo ? 'Devuelta por caja' : 'Esperando cobro'}</span>` : '<span class="badge badge-success">Cobrada</span>'}${Number(v.ediciones) > 0 ? ' <span class="badge badge-warning" title="Se quitaron productos después de la venta">Modificada</span>' : ''}</td>
    <td class="c-acc"><button type="button" class="btn btn-outline btn-sm" data-ver="${v.id}">Ver</button></td>
  </tr>`).join('');
}

document.getElementById('tabla-body').addEventListener('click', e => {
  const b = e.target.closest('[data-ver]'); if (!b) return;
  abrir(Number(b.dataset.ver));
});

// Quitar productos (sql/020): mismas reglas que anular, con sus propios permisos
function puedeEditar(v) {
  if (v.estado !== 'cerrada' && v.estado !== 'pendiente_cobro') return false;
  if ((v.venta_items || []).filter(i => i.cantidad > 0).reduce((s, i) => s + i.cantidad, 0) < 2) return false;  // con 1 unidad: anular
  if (Auth.puede('ventas.editar_todas', perfil)) return true;
  if (!Auth.puede('ventas.editar_propias', perfil)) return false;
  return v.vendedor_id === perfil.id && (Date.now() - new Date(v.fecha).getTime()) < 24*3600e3;
}

function puedeAnular(v) {
  if (v.estado === 'pendiente_cobro' && Auth.puede('caja.cobrar', perfil)) return true;   // la caja cancela lo que espera cobro
  if (v.estado !== 'cerrada' && v.estado !== 'pendiente_cobro') return false;
  if (Auth.puede('ventas.anular_todas', perfil)) return true;
  if (!Auth.puede('ventas.anular_propias', perfil)) return false;
  return v.vendedor_id === perfil.id && (Date.now() - new Date(v.fecha).getTime()) < 24*3600e3;
}

function abrir(id) {
  const v = ventas.find(x => x.id === id); if (!v) return;
  const bd = document.createElement('div'); bd.className = 'modal-backdrop';
  bd.innerHTML = `<div class="modal modal-lg">
    <div class="modal-header"><h3 class="modal-title">Venta ${esc(v.codigo)}</h3><button class="modal-close" id="_x">×</button></div>
    <div class="modal-body">
      <div class="vta-grid">
        <div><b>Fecha</b>${Utils.datetime(v.fecha)}</div>
        <div><b>Vendedor</b>${esc(v.vendedor_nombre||'—')}</div>
        <div><b>Cliente</b>${esc(v.cliente_nombre||'Consumidor final')}${v.cliente_telefono ? ' · ' + esc(v.cliente_telefono) : ''}</div>
        ${v.origen === 'web' ? `<div><b>Origen</b>🌐 Pedido web${v.solicitud_id && Auth.puede('pedidos.gestionar', perfil) ? ` · <a href="/admin/pedidos?ver=${v.solicitud_id}">ver pedido</a>` : ''}</div>` : ''}
        <div><b>Medio de pago</b><span class="vta-medio vta-medio-${esc(v.medio_pago)}">${esc(MEDIOS[v.medio_pago]||v.medio_pago)}</span>${v.cc_cuenta_id && Auth.puede('cc.ver', perfil) ? ` <a href="/admin/cuentas-corrientes?cuenta=${v.cc_cuenta_id}" style="font-size:12px">ver cuenta →</a>` : ''}</div>
        ${v.retira_nombre ? `<div><b>Retiró</b>${esc(v.retira_nombre)}</div>` : ''}
        ${v.entrega_tipo && v.entrega_tipo !== 'en_el_momento' ? `<div style="grid-column:1/-1"><b>Entrega</b>${v.entrega_tipo === 'retiro' ? '🏬 Retira en el local' : `🚚 Envío a ${esc(v.envio_direccion || '')}, ${esc(v.envio_localidad || '')}`}
          · ${v.entrega_estado === 'entregado' ? `entregada ${Utils.datetime(v.entregada_en)}${v.recibio_nombre ? ' a ' + esc(v.recibio_nombre) : ''}${v.envio_seguimiento ? ' · guía ' + esc(v.envio_seguimiento) : ''}` : v.entrega_estado === 'listo' ? 'preparada, falta entregar' : 'pendiente'}
          · <a href="/admin/entregas?tab=${v.entrega_estado === 'entregado' ? 'hechas' : v.entrega_tipo === 'retiro' ? 'retiros' : 'envios'}">ver en Entregas</a></div>` : ''}
        ${Number(v.recargo_total) > 0 ? `<div><b>Recargo cuenta corriente</b>${money(v.recargo_total)}</div>` : ''}
        ${v.notas ? `<div style="grid-column:1/-1"><b>Nota</b>${esc(v.notas)}</div>` : ''}
        ${v.estado==='pendiente_cobro' ? `<div style="grid-column:1/-1;color:#92400E"><b>Esperando cobro en la caja</b>${v.devuelta_motivo ? 'La caja la devolvió: ' + esc(v.devuelta_motivo) : 'No entregar la mercadería hasta que figure cobrada.'}</div>` : ''}
        ${v.cobrada_en ? `<div><b>Cobró</b>${esc(v.cobrada_por_nombre || '—')} · ${Utils.datetime(v.cobrada_en)}</div>` : ''}
        ${(v.venta_pagos || []).length > 1 ? `<div style="grid-column:1/-1"><b>Cómo pagó</b>${v.venta_pagos.slice().sort((a, b) => a.orden - b.orden).map(p => `${esc(MEDIOS[p.medio_pago] || p.medio_pago)} ${money(p.monto)}${Number(p.monto) !== Number(p.monto_original) ? ` <span style="color:var(--muted)">(eran ${money(p.monto_original)})</span>` : ''}`).join(' · ')}</div>` : ''}
        ${v.estado==='anulada' ? `<div style="grid-column:1/-1;color:var(--danger)"><b>Anulada</b>${Utils.datetime(v.anulada_en)} · ${esc(v.motivo_anulacion||'')}</div>` : ''}
      </div>
      <table class="vta-items"><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th><th>Stock</th></tr></thead>
      <tbody>${(v.venta_items||[]).sort((a,b)=>a.orden-b.orden).map(i => `<tr${i.cantidad === 0 ? ' style="color:var(--muted);text-decoration:line-through"' : ''}><td>${esc(i.nombre)}${i.cantidad_original != null && i.cantidad_original !== i.cantidad ? `<div style="font-size:11px;color:var(--warning);text-decoration:none">se quitaron ${i.cantidad_original - i.cantidad} de ${i.cantidad_original}</div>` : ''}${i.sku?`<div style="font-size:11px;color:var(--muted)">${esc(i.sku)}</div>`:''}</td><td class="r">${i.cantidad}</td><td class="r">${money(i.precio_unitario)}${Number(i.recargo_unitario) > 0 ? `<div style="font-size:11px;color:var(--muted)">incl. +${money(i.recargo_unitario)} cta. cte.</div>` : ''}</td><td class="r">${money(i.subtotal)}</td><td>${i.afecto_stock ? `<span class="ctrl ctrl-si">descontó → ${i.stock_posterior}</span>` : (i.producto_id ? '<span class="ctrl ctrl-no">sin tocar stock</span>' : '<span class="ctrl ctrl-libre">fuera del catálogo</span>')}</td></tr>`).join('')}</tbody></table>
      <div style="text-align:right;font-size:14px">${Number(v.descuento)>0 ? `Subtotal ${money(v.subtotal)} · Descuento −${money(v.descuento)}<br>` : ''}<b style="font-size:18px">Total ${money(v.total)}</b></div>
      <div id="_ediciones"></div>
    </div>
    <div class="modal-footer">
      ${puedeAnular(v) ? `<button class="btn btn-danger" id="_anular">Anular venta</button>` : ''}
      ${puedeEditar(v) ? `<button class="btn btn-outline" id="_quitar">➖ Quitar productos</button>` : ''}
      <span style="flex:1"></span>
      <button class="btn btn-outline" id="_imprimir">🖨️ Imprimir ticket</button>
      <button class="btn btn-outline" id="_ok">Cerrar</button>
    </div></div>`;
  document.body.appendChild(bd);
  bd.querySelector('#_x').onclick = bd.querySelector('#_ok').onclick = () => bd.remove();
  bd.querySelector('#_imprimir').addEventListener('click', () => MHImprimir.ticket(v));
  bd.querySelector('#_quitar')?.addEventListener('click', () => { bd.remove(); modalQuitar(v); });
  if (Number(v.ediciones) > 0) cargarEdiciones(v.id, bd.querySelector('#_ediciones'));
  bd.querySelector('#_anular')?.addEventListener('click', async () => {
    const motivo = prompt(v.medio_pago === 'cuenta_corriente'
      ? '¿Por qué se anula la venta? (vuelve el stock de los productos controlados y se descuenta de la cuenta corriente del cliente)'
      : v.medio_pago === 'web' ? '¿Por qué se anula la venta? (vuelve el stock; el pedido web queda sin venta. Lo pagado online se devuelve por fuera de la caja)'
      : '¿Por qué se anula la venta? (vuelve el stock de los productos controlados y sale la devolución de la caja)');
    if (motivo === null) return;
    if (!motivo.trim()) { Utils.toast('Escribí el motivo', 'warning'); return; }
    const { data, error } = await db.rpc('venta_anular', { p_venta_id: v.id, p_motivo: motivo.trim() });
    if (error) { Utils.toast(error.hint || error.message, 'error', 7000); return; }
    Utils.toast(`Venta anulada${data?.movimientos ? ` · ${data.movimientos} producto(s) repuestos` : ''}`, 'success');
    bd.remove(); cargar();
  });
}

/* ── Historial de cambios de una venta ── */
async function cargarEdiciones(ventaId, el) {
  const { data, error } = await db.from('venta_ediciones').select('*').eq('venta_id', ventaId).order('fecha');
  if (error || !data?.length) return;
  el.innerHTML = `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Productos quitados después de la venta</div>
    ${data.map(e => `<div style="font-size:13px;margin-bottom:6px">${Utils.datetime(e.fecha)} · <b>${esc(e.usuario_nombre || '')}</b> · ${money(e.total_anterior)} → ${money(e.total_nuevo)}
      <div style="color:var(--muted)">${(e.detalle || []).map(d => `−${d.quitadas} ${esc(d.nombre)}`).join(', ')} · “${esc(e.motivo)}”</div></div>`).join('')}
  </div>`;
}

/* ── Quitar productos que el cliente al final no se llevó (sql/020) ── */
function modalQuitar(v) {
  const its = (v.venta_items || []).filter(i => i.cantidad > 0).sort((a, b) => a.orden - b.orden);
  const quitar = Object.fromEntries(its.map(i => [i.id, 0]));
  const bd = document.createElement('div'); bd.className = 'modal-backdrop';
  const destino = v.medio_pago === 'cuenta_corriente'
    ? 'se descuenta de la cuenta corriente del cliente'
    : v.medio_pago === 'web' ? 'lo pagado online se devuelve por fuera de la caja (transferencia al cliente)'
    : `sale de la caja como devolución (${esc(MEDIOS[v.medio_pago] || v.medio_pago)})`;
  bd.innerHTML = `<div class="modal modal-lg"><div class="modal-header"><h3 class="modal-title">Quitar productos · ${esc(v.codigo)}</h3><button class="modal-close" data-x aria-label="Cerrar">×</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Marcá cuántas unidades <b>no se lleva</b> el cliente. El stock vuelve solo y la diferencia ${destino}.</p>
      <table class="vta-items"><thead><tr><th>Producto</th><th class="r">Vendidas</th><th class="r">Precio</th><th class="r" style="width:150px">Quitar</th></tr></thead>
      <tbody>${its.map(i => `<tr><td>${esc(i.nombre)}</td><td class="r">${i.cantidad}</td><td class="r">${money(i.precio_unitario)}</td>
        <td class="r"><div class="qty-ctl" style="justify-content:flex-end"><button type="button" data-q="-1" data-id="${i.id}" aria-label="Menos">−</button><input type="number" min="0" max="${i.cantidad}" value="0" data-id="${i.id}" aria-label="Unidades a quitar" style="width:52px;text-align:center"><button type="button" data-q="1" data-id="${i.id}" aria-label="Más">+</button></div></td></tr>`).join('')}</tbody></table>
      <div style="text-align:right;margin-top:10px;font-size:14px" id="_res"></div>
      <div class="form-group" style="margin-top:12px"><label>Motivo <span class="req">*</span></label><input type="text" id="_mot" maxlength="300" placeholder="Ej: al retirar no quiso la pava"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" data-x>Cancelar</button><button class="btn btn-primary" id="_ok" disabled>Quitar</button></div></div>`;
  document.body.appendChild(bd);
  bd.querySelectorAll('[data-x]').forEach(b => b.onclick = () => bd.remove());
  const pintar = () => {
    let menos = 0, unidades = 0, quedan = 0;
    its.forEach(i => { menos += quitar[i.id] * Number(i.precio_unitario); unidades += quitar[i.id]; quedan += i.cantidad - quitar[i.id];
      bd.querySelector(`input[data-id="${i.id}"]`).value = quitar[i.id]; });
    const sub = its.reduce((s, i) => s + (i.cantidad - quitar[i.id]) * Number(i.precio_unitario), 0);
    const nuevo = Math.max(0, sub - Math.min(Number(v.descuento || 0), sub));
    const vacia = quedan === 0;
    bd.querySelector('#_res').innerHTML = unidades
      ? (vacia ? '<span style="color:var(--danger)">No puede quedar vacía: si no se lleva nada, anulá la venta.</span>'
               : `Total ${money(v.total)} → <b>${money(nuevo)}</b> · ${v.medio_pago === 'cuenta_corriente' ? 'baja la deuda' : 'se devuelve'} <b>${money(Number(v.total) - nuevo)}</b>`)
      : '<span style="color:var(--muted)">Elegí qué quitar.</span>';
    bd.querySelector('#_ok').disabled = !unidades || vacia;
    bd.querySelector('#_ok').textContent = unidades ? `Quitar ${unidades} unidad${unidades !== 1 ? 'es' : ''}` : 'Quitar';
  };
  bd.addEventListener('click', e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    const i = its.find(x => x.id === Number(b.dataset.id));
    quitar[i.id] = Math.max(0, Math.min(i.cantidad, quitar[i.id] + Number(b.dataset.q))); pintar();
  });
  bd.addEventListener('input', e => {
    const inp = e.target.closest('input[data-id]'); if (!inp) return;
    const i = its.find(x => x.id === Number(inp.dataset.id));
    quitar[i.id] = Math.max(0, Math.min(i.cantidad, parseInt(inp.value, 10) || 0));
  });
  bd.addEventListener('change', e => { if (e.target.closest('input[data-id]')) pintar(); });
  pintar();
  bd.querySelector('#_ok').addEventListener('click', async () => {
    const motivo = bd.querySelector('#_mot').value.trim();
    if (!motivo) { Utils.toast('Escribí el motivo', 'warning'); bd.querySelector('#_mot').focus(); return; }
    const lista = its.filter(i => quitar[i.id] > 0).map(i => ({ item_id: i.id, quitar: quitar[i.id] }));
    const btn = bd.querySelector('#_ok'); btn.disabled = true;
    const { data, error } = await db.rpc('venta_quitar_items', { p_venta_id: v.id, p_items: lista, p_motivo: motivo });
    if (error) {
      btn.disabled = false;
      const m = (error.message || '').toLowerCase();
      Utils.toast(m.includes('could not find') || m.includes('schema cache') ? 'Falta ejecutar sql/020-editar-venta.sql en la base de datos.' : (error.hint || error.message), 'error', 7000);
      return;
    }
    bd.remove();
    Utils.toast(`Listo: ${data.medio_pago === 'cuenta_corriente' ? 'baja la deuda' : 'se devuelve'} ${money(data.diferencia)}`, 'success', 6000);
    await cargar();
    const nueva = ventas.find(x => x.id === v.id);
    if (nueva && await Utils.confirm('¿Imprimir el ticket corregido para el cliente?', 'Venta modificada', '🖨️ Imprimir', false)) MHImprimir.ticket(nueva);
  });
}

document.getElementById('btn-export').addEventListener('click', () => {
  const filas = [];
  filtrar().forEach(v => (v.venta_items||[]).forEach(i => filas.push({
    Fecha: Utils.datetime(v.fecha), Codigo: v.codigo, Estado: v.estado, Vendedor: v.vendedor_nombre||'', Cliente: v.cliente_nombre||'',
    Medio: MEDIOS[v.medio_pago]||v.medio_pago, Producto: i.nombre, SKU: i.sku||'', Cantidad: i.cantidad, Precio: i.precio_unitario, Subtotal: i.subtotal,
    'Afecto stock': i.afecto_stock ? 'sí' : 'no', 'Total venta': v.total, Descuento: v.descuento
  })));
  if (!filas.length) { Utils.toast('No hay nada para exportar', 'warning'); return; }
  Utils.exportCSV(filas, `ventas-local-${$id('f-desde').value}_${$id('f-hasta').value}.csv`);
});
document.getElementById('btn-refrescar').addEventListener('click', cargar);

async function initPage() {
  perfil = await Auth.init();
  if (!perfil) return;
  const soloLasMias = !Auth.puede('ventas.ver_todas', perfil);
  await Layout.init('ventas', soloLasMias ? 'Mis ventas' : 'Ventas');
  // Sin "ver las ventas de todos" (sql/016) ve solo las suyas: sin filtro por vendedor
  if (soloLasMias) {
    document.querySelector('.page-header h1').textContent = 'Mis ventas';
    $id('subtitle').textContent = 'Lo que cobraste vos en el mostrador. Los pedidos de la tienda están en Pedidos web.';
    $id('f-vend').hidden = true;
  }
  await setRango('hoy');
  // Link directo a una venta (desde Crear venta): /admin/ventas?ver=123
  const ver = Number(new URLSearchParams(location.search).get('ver'));
  if (ver) { $id('f-estado').value = ''; render(); if (ventas.some(v => v.id === ver)) abrir(ver); }
}
// Al volver a este módulo dentro del armazón: datos al día (salvo con un diálogo abierto)
window.MHAlMostrar = () => { if (!document.querySelector('.modal-backdrop, .sol-modal-bg, .modal[style*="flex"]')) cargar(); };
initPage();
</script>
