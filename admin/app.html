<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#0A2E63">
  <link rel="icon" type="image/png" href="/images/marca/favicon.png">
  <link rel="apple-touch-icon" href="/images/marca/icon-192.png">
  <title>Mundo Hogar Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zydotmaolgddwenwywyc.supabase.co" crossorigin>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    /* El panel como una sola aplicación: el menú y la barra de arriba quedan
       fijos; cada módulo vive en su propio marco, que sigue abierto al cambiar
       de módulo (volver es instantáneo y no se pierde lo que había en pantalla). */
    html, body { height:100%; overflow:hidden; }
    .admin-layout { height:100vh; min-height:0; }
    .main-wrap { height:100vh; min-height:0; }
    .app-marcos { flex:1; position:relative; min-height:0; background:var(--bg); }
    .app-marcos iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
    .app-marcos iframe.activo { display:block; }
    .app-cargando { position:absolute; left:0; right:0; top:0; height:3px; overflow:hidden; z-index:5; opacity:0; transition:opacity .2s; pointer-events:none; }
    .app-cargando.si { opacity:1; }
    .app-cargando::before { content:''; position:absolute; top:0; bottom:0; width:35%; background:var(--gold); animation:appBarra 1s ease-in-out infinite; }
    @keyframes appBarra { from { left:-35%; } to { left:100%; } }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img class="sidebar-brand-icon" src="/images/marca/logo-mundo-hogar.png" alt="Mundo Hogar" width="32" height="32"><div class="sidebar-brand-text"><span class="sidebar-brand-name">Mundo Hogar</span><span class="sidebar-brand-sub">Panel Admin</span></div></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar" id="user-avatar">?</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name">Cargando...</div><div class="sidebar-user-role" id="user-role"></div></div></div></div>
  </aside>
  <div class="mobile-overlay" id="mobile-overlay"></div>
  <div class="main-wrap">
    <header class="main-header">
      <button class="header-toggle" id="sidebar-toggle">☰</button>
      <span class="header-title" id="page-title"></span>
      <div class="header-actions">
        <a href="/" target="_blank" class="btn btn-ghost btn-sm">🌐 Ver Tienda</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
      </div>
    </header>
    <div class="app-marcos" id="app-marcos"><div class="app-cargando" id="app-cargando"></div></div>
  </div>
</div>
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script src="/admin/js/supabase-client.js"></script>
<script src="/admin/js/auth.js"></script>
<script src="/admin/js/utils.js"></script>
<script src="/admin/js/layout.js"></script>
<script src="/admin/js/app.js"></script>
<script src="/admin/js/assistant.js"></script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/admin/sw.js').catch(()=>{}); }</script>
</body>
</html>
