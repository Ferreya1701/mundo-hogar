<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#0A2E63">
  <link rel="icon" type="image/png" href="/images/marca/favicon.png">
  <link rel="apple-touch-icon" href="/images/marca/icon-192.png">
  <title>Iniciar sesión — Mundo Hogar Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://vduinkzeneokkqzdgxig.supabase.co" crossorigin>
  <script>try{if(localStorage.getItem('mhTema')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img class="login-logo-icon" src="/images/marca/logo-mundo-hogar.png" alt="Mundo Hogar" width="52" height="52">
      <h1>Mundo Hogar</h1>
      <p>Panel de Administración</p>
    </div>

    <div class="login-err" id="login-error" role="alert" aria-live="assertive"></div>

    <form class="login-form" id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email"
               placeholder="nombre@correo.com" required autocomplete="email" autocapitalize="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="login-clave">
          <input type="password" id="password" name="password"
                 placeholder="••••••••" required autocomplete="current-password" aria-describedby="caps-aviso">
          <button type="button" class="login-ver" id="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">👁</button>
        </div>
        <div class="login-caps" id="caps-aviso" hidden>⇪ Está activado Bloq Mayús</div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg login-btn" id="login-btn">
        Ingresar
      </button>
    </form>
    <details class="login-olvido">
      <summary>¿Olvidaste tu contraseña?</summary>
      <p>Pedile al administrador una nueva: en <b>Usuarios → 🔑 Clave nueva</b> te genera una contraseña temporal. Al entrar con esa, el panel te pide elegir una propia.</p>
    </details>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script src="/admin/js/supabase-client.js"></script>
<script>
(async function () {
  // Si ya hay sesión activa, redirigir al dashboard
  // (sin sesión, se borra el menú guardado de otro usuario que haya usado esta pestaña)
  const { data: { session } } = await db.auth.getSession();
  if (session) { window.location.href = '/admin/app'; return; }
  try { sessionStorage.removeItem('mhPerfil'); } catch (e) {}

  const form = document.getElementById('login-form');
  const btn  = document.getElementById('login-btn');
  const err  = document.getElementById('login-error');

  // Ver / ocultar la contraseña
  const pass = document.getElementById('password'), ver = document.getElementById('ver-clave');
  ver.addEventListener('click', () => {
    const mostrar = pass.type === 'password';
    pass.type = mostrar ? 'text' : 'password';
    ver.setAttribute('aria-pressed', String(mostrar));
    ver.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
    ver.textContent = mostrar ? '🙈' : '👁';
    pass.focus();
  });
  // Aviso de Bloq Mayús (la causa más común de "contraseña incorrecta")
  const caps = document.getElementById('caps-aviso');
  ['keydown', 'keyup'].forEach(t => pass.addEventListener(t, e => { if (e.getModifierState) caps.hidden = !e.getModifierState('CapsLock'); }));
  pass.addEventListener('blur', () => { caps.hidden = true; });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email    = form.email.value.trim();
    const password = form.password.value;

    if (!email || !password) {
      showError('Completá todos los campos.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Ingresando...';
    err.style.display = 'none';

    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      showError(mapError(error.message));
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      return;
    }

    // Verificar que el perfil exista y esté activo
    const { data: profile } = await db.from('profiles')
      .select('activo, rol')
      .eq('id', data.user.id)
      .single();

    if (!profile?.activo) {
      await db.auth.signOut();
      showError('Tu cuenta está desactivada. Contactá al administrador.');
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      return;
    }

    // El cajero arranca en la caja (sql/029); el resto, en el inicio
    window.location.href = '/admin/app';   // el armazón elige el inicio según el rol
  });

  function showError(msg) {
    err.textContent = msg;
    err.style.display = 'block';
  }

  function mapError(msg) {
    if (msg.includes('Invalid login credentials')) return 'Email o contraseña incorrectos.';
    if (msg.includes('Email not confirmed'))       return 'Debés confirmar tu email primero.';
    if (msg.includes('Too many requests'))         return 'Demasiados intentos. Esperá unos minutos.';
    return 'Error al iniciar sesión. Intentá de nuevo.';
  }
})();
</script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/admin/sw.js').catch(()=>{}); }</script>
</body>
</html>
